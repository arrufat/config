# VA-API hardware video decode/encode (Intel iHD)
# Vulkan/Graphite rendering: first suspect if video decode falls back to software
# JXLImageFormat: JPEG XL; OverlayScrollbar: thin GNOME-like scrollbars
# ParallelDownloading: split large downloads into several connections
# Only the last --enable-features= counts, so keep all features on one line
--enable-features=VaapiVideoDecoder,VaapiVideoEncoder,VaapiIgnoreDriverChecks,Vulkan,DefaultANGLEVulkan,VulkanFromANGLE,SkiaGraphite,JXLImageFormat,OverlayScrollbar,ParallelDownloading
# Middle-click autoscroll (Blink features take a separate switch)
--enable-blink-features=MiddleClickAutoscroll
--gtk-version=4
