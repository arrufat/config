# Hardware decoding (VA-API on the Arc iGPU); falls back to software safely
hwdec=auto-safe

# Don't fetch streams larger than the 1080p panel
ytdl-format=bestvideo[height<=?1080]+bestaudio/best

# Stay on the last frame instead of quitting; resume where a file was left
keep-open=yes
save-position-on-quit

# Screenshots (s key) go here instead of the current directory; created on demand
screenshot-directory=~/Pictures/mpv

# Also load loosely matching sibling subs (jamak saves <video>.<lang>.srt,
# which the default `exact` finds; fuzzy catches other naming schemes too)
sub-auto=fuzzy
slang=en,ko

# Korean legacy subs are often EUC-KR/CP949; mpv autodetects via uchardet.
# Uncomment only if a subtitle misrenders:
#sub-codepage=cp949
