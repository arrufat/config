# Hot reload the config
bind r source-file ~/.config/tmux/tmux.conf

# Reduce the delay to distinguish between Alt+Key and Esc
set -sg escape-time 25

set -g history-limit 10000

# tmux detects foot's features itself (RGB, usstyle, extkeys, focus, …)
set -g default-terminal "tmux-256color"

# Claude Code clamps to 256 colors under tmux unless told RGB works
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# Forward focus in/out to apps in panes (Claude Code, vim autoread, …)
set -g focus-events on

# Let notifications / progress-bar escape sequences reach foot
set -g allow-passthrough on

# Let apps tell Shift+Enter apart from Enter
set -s extended-keys on

# Vim friendly tmux configuration
set -g mode-keys vi
bind Space copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
# copy to and from system clipbloard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy && wl-paste -n | wl-copy -p"
bind-key p run "wl-paste -n | tmux load-buffer - ; tmux paste-buffer -p"

# Mouse support
set -g mouse on
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy && wl-paste -n | wl-copy -p"

# Rename your terminals
set -g set-titles on

# Set window title string
#  #H  Hostname of local host
#  #I  Current window index
#  #P  Current pane index
#  #S  Session name
#  #T  Current window title
#  #W  Current window name
#  #   A literal ‘#’

set -g set-titles-string '#T'

# open new terminals in the current working directory
# new window
bind-key c new-window -c '#{pane_current_path}'
# new horizontal split
bind-key '"' split-window -c '#{pane_current_path}'
# new vertical split
bind-key % split-window -h -c '#{pane_current_path}'
# new session
bind-key C command-prompt "new-session -A -c '#{pane_current_path}' -s '%%'"
# swap marked pane
bind-key S swap-pane

# Easy window navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Save/restore sessions (resurrect-like), also saved on every detach
bind-key C-s run-shell '~/.config/tmux/sessions.sh save' \; display 'Sessions saved'
bind-key C-r run-shell '~/.config/tmux/sessions.sh restore'
set-hook -g client-detached "run-shell -b '~/.config/tmux/sessions.sh save'"

# Nord status bar, using foot's Nord palette
set -g status-style bg=black,fg=white
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=blue
set -g message-style bg=brightblack,fg=cyan
set -g message-command-style bg=brightblack,fg=cyan
set -g display-panes-colour black
set -g display-panes-active-colour brightblack
setw -g clock-mode-colour cyan

# Session name turns yellow while the prefix is pressed, green in copy mode
%hidden MODE="#{?client_prefix,yellow,#{?pane_in_mode,green,blue}}"
set -g status-left "#[fg=black,bg=#{E:MODE},bold] #S #[default] "
set -g status-right "#[bg=brightblack] %Y-%m-%d  %H:%M #[fg=black,bg=cyan,bold] #H "
set -g window-status-format "#[bg=brightblack] #I #W #F "
set -g window-status-current-format "#[fg=black,bg=cyan] #I #W #F "
set -g window-status-current-style default
set -g window-status-separator " "
